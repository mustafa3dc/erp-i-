services:
  web:
    type: web
    name: mmobile-erp-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .. && mkdir -p backend/app/templates/assets && cp -r frontend/dist/assets/* backend/app/templates/assets/ && cp frontend/dist/index.html backend/app/templates/index.html"
    startCommand: "gunicorn -k uvicorn.workers.UvicornWorker backend.app.main:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
